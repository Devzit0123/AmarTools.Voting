services:
  - type: web
    name: amartools-voting
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__VotingConnection
        fromDatabase:
          name: amartools-voting-db
          property: connectionString
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
      - key: Database__ApplyMigrations
        value: "true"
      # SMTP for confirmation / password-reset emails (set the values in the Render dashboard)
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false

databases:
  - name: amartools-voting-db
    plan: free
