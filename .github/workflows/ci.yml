name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore AmarTools.Voting.csproj
          dotnet restore Tests/AmarTools.Voting.Tests.csproj

      - name: Build (warnings are errors)
        run: dotnet build AmarTools.Voting.csproj --no-restore --configuration Release -warnaserror

      # Selenium tests skip themselves because AMARTOOLS_BASE_URL is not set here.
      - name: Test
        run: >
          dotnet test Tests/AmarTools.Voting.Tests.csproj
          --no-restore --configuration Release
          --logger "trx;LogFileName=ci.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
